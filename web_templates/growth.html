<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Growth Engine</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .g-wrap { max-width: 1080px; margin: 0 auto; padding: 16px 20px 80px; font-family: -apple-system, "PingFang SC", sans-serif; }
    .g-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .g-top select, .g-top input { padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 6px; }
    .g-goal { flex: 1; min-width: 320px; display: flex; gap: 8px; }
    .g-goal input { flex: 1; }
    .g-btn { padding: 8px 16px; border: none; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; }
    .g-btn:disabled { background: #94a3b8; cursor: default; }
    .g-btn.warn { background: #9a3412; }
    .g-btn.ghost { background: #e2e8f0; color: #1e293b; }
    .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .g-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #fff; }
    .g-card h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .g-card h3 .g-count { font-size: 12px; color: #64748b; font-weight: normal; }
    .g-item { border-top: 1px dashed #e2e8f0; padding: 8px 0; font-size: 13px; }
    .g-item:first-of-type { border-top: none; }
    .g-muted { color: #64748b; font-size: 12px; }
    .g-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #eef2ff; color: #3730a3; margin-right: 4px; }
    .g-tag.ok { background: #dcfce7; color: #166534; }
    .g-tag.warn { background: #fef9c3; color: #854d0e; }
    .g-tag.bad { background: #fee2e2; color: #991b1b; }
    .g-answer { white-space: pre-wrap; background: #f8fafc; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.7; }
    .g-log { font-family: ui-monospace, monospace; font-size: 11.5px; color: #475569; max-height: 180px; overflow: auto; }
    .g-log div { padding: 1px 0; }
    details { font-size: 12px; color: #475569; }
    details pre { background: #f1f5f9; padding: 8px; border-radius: 6px; overflow: auto; max-height: 240px; }
    .g-full { grid-column: 1 / -1; }
    textarea { width: 100%; min-height: 70px; font-family: inherit; font-size: 12px; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
    .g-nav { font-size: 12px; margin-bottom: 12px; }
    .g-nav a { color: #1f6feb; }
  </style>
</head>
<body>
<div class="g-wrap">
  <div class="g-nav"><a href="/">← 评论分析工作台</a> · <strong>AI Growth Engine</strong></div>

  <div class="g-top">
    <label>产品
      <select id="gProduct"></select>
    </label>
    <button class="g-btn ghost" id="gSeedDemo" type="button">加载演示数据(DEMO)</button>
    <div class="g-goal">
      <input id="gGoal" placeholder="例：为 YouVibe 规划下周最值得做的三个内容方向 / 复盘上轮实验，告诉我下周怎么调整">
      <button class="g-btn" id="gRun" type="button">让 AI 工作</button>
      <button class="g-btn warn" id="gStop" type="button" disabled>停止</button>
    </div>
  </div>

  <div class="g-grid">
    <div class="g-card g-full">
      <h3>AI 增长助手 <span class="g-count" id="gSessionMeta">未运行</span></h3>
      <div class="g-answer" id="gAnswer">输入增长目标后，AI 会自主选择工具完成任务。配置 API Key 可启用真实模型（当前页默认 Mock，结论会明确标注）。</div>
      <details style="margin-top:8px"><summary>工具调用与审计日志</summary>
        <div class="g-log" id="gLog"></div>
      </details>
    </div>

    <div class="g-card">
      <h3>增长机会 <span class="g-count" id="gOppCount"></span></h3>
      <div id="gOpps"><span class="g-muted">暂无</span></div>
    </div>

    <div class="g-card">
      <h3>内容任务书（需人工批准） <span class="g-count" id="gBriefCount"></span></h3>
      <div id="gBriefs"><span class="g-muted">暂无</span></div>
    </div>

    <div class="g-card">
      <h3>内容资产 <span class="g-count" id="gAssetCount"></span></h3>
      <div id="gAssets"></div>
      <details style="margin-top:8px"><summary>导入素材（JSON 或 CSV）</summary>
        <textarea id="gAssetImport" placeholder='[{"asset_id":"a1","title":"标题","topics":["AI 动画"],"license_status":"owned"}] 或 CSV 文本'></textarea>
        <button class="g-btn ghost" id="gImportAssets" type="button" style="margin-top:6px">导入</button>
      </details>
    </div>

    <div class="g-card">
      <h3>增长实验与复盘 <span class="g-count" id="gExpCount"></span></h3>
      <div id="gExps"></div>
      <details style="margin-top:8px"><summary>登记发布结果（未获取的指标留空=Unknown）</summary>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">
          <input id="gPubExp" placeholder="实验 ID">
          <input id="gPubChannel" placeholder="平台（如 bilibili）">
          <input id="gPubUrl" placeholder="内容链接">
          <input id="gPubDate" placeholder="发布日期 2026-04-01">
          <input id="gPubViews" placeholder="播放(可空)">
          <input id="gPubVisits" placeholder="有效到站(可空)">
        </div>
        <button class="g-btn ghost" id="gRecordPub" type="button" style="margin-top:6px">登记</button>
      </details>
    </div>

    <div class="g-card g-full">
      <h3>经验记录 <span class="g-count" id="gLearnCount"></span></h3>
      <div id="gLearnings"><span class="g-muted">暂无</span></div>
    </div>
  </div>
</div>
<script src="/static/growth.js?v=1"></script>
</body>
</html>
