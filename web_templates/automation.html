<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站回复自动化 · 监工台</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .au-wrap { max-width: 1020px; margin: 0 auto; padding: 16px 20px 80px; font-family: -apple-system, "PingFang SC", sans-serif; }
    .au-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .au-top h1 { font-size: 18px; margin: 0; }
    .au-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .au-chip { font-size: 12px; padding: 4px 12px; border-radius: 12px; background: #eef2ff; color: #3730a3; }
    .au-chip.on { background: #dcfce7; color: #166534; }
    .au-chip.warn { background: #fef9c3; color: #854d0e; }
    .au-chip.bad { background: #fee2e2; color: #991b1b; }
    .au-grid { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
    @media (max-width: 900px) { .au-grid { grid-template-columns: 1fr; } }
    .au-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #fff; margin-bottom: 14px; }
    .au-card h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .au-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fff; }
    .au-item-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .au-tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #eef2ff; color: #3730a3; }
    .au-tag.a { background: #dcfce7; color: #166534; }
    .au-tag.b { background: #fef9c3; color: #854d0e; }
    .au-quote { background: #f8fafc; border-left: 3px solid #cbd5e1; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin: 6px 0; }
    .au-video { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .au-draft { width: 100%; box-sizing: border-box; min-height: 84px; border: 1px solid #d0d7de; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6; font-family: inherit; }
    .au-lint { font-size: 12px; color: #b45309; margin-top: 4px; }
    .au-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .au-btn { padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .au-btn.primary { background: #1f6feb; color: #fff; }
    .au-btn.ghost { background: #e2e8f0; color: #1e293b; }
    .au-btn.danger { background: #fee2e2; color: #991b1b; }
    .au-btn:disabled { background: #94a3b8; color: #fff; cursor: default; }
    .au-side-row { font-size: 13px; padding: 6px 0; border-top: 1px dashed #e2e8f0; display: flex; justify-content: space-between; gap: 8px; }
    .au-side-row:first-of-type { border-top: none; }
    .au-log { font-family: ui-monospace, monospace; font-size: 11.5px; color: #475569; max-height: 220px; overflow: auto; white-space: pre-wrap; }
    .au-config label { display: block; font-size: 12px; color: #475569; margin: 8px 0 3px; }
    .au-config input, .au-config textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; }
    .au-note { font-size: 12px; color: #64748b; line-height: 1.7; }
    a.au-link { color: #1f6feb; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
<div class="au-wrap">
  <div class="au-top">
    <h1>🤖 B站回复自动化 · 监工台</h1>
    <span id="cycle-state" class="au-chip">加载中…</span>
    <span style="flex:1"></span>
    <button id="btn-enable" class="au-btn primary">启动自动化</button>
    <button id="btn-collect" class="au-btn ghost">立即采集</button>
    <a class="au-link" href="/">← 返回工作台</a>
  </div>

  <div class="au-chips" id="chips"></div>

  <div class="au-grid">
    <div>
      <div class="au-card">
        <h3>待审队列 <span class="au-tag" id="queue-count">0</span></h3>
        <div id="queue">
          <div class="au-note">暂无待审条目。启动后每周期自动采集 → 筛选 → 起草 → 进入这里等批准。</div>
        </div>
      </div>
      <div class="au-card">
        <h3>已批待发 <span class="au-tag" id="approved-count">0</span></h3>
        <div id="approved-list"><div class="au-note">暂无。批准后的条目在这里排队，按节奏自动发送。</div></div>
      </div>
      <div class="au-card">
        <h3>最近发送 <a class="au-link" href="javascript:void(0)" onclick="toggleHistory()">展开/收起</a></h3>
        <div id="history" style="display:none"></div>
      </div>
    </div>

    <div>
      <div class="au-card">
        <h3>发送监控</h3>
        <div id="sender-panel"><div class="au-note">加载中…</div></div>
      </div>
      <div class="au-card">
        <h3>周期信息</h3>
        <div id="cycle-panel"><div class="au-note">加载中…</div></div>
      </div>
      <div class="au-card au-config">
        <h3>参数配置 <a class="au-link" href="javascript:void(0)" onclick="toggleConfig()">展开/收起</a></h3>
        <div id="config-panel" style="display:none">
          <label>搜索关键词（逗号分隔）</label>
          <textarea id="cfg-keywords" rows="2"></textarea>
          <label>采集间隔（小时）</label><input id="cfg-interval" type="number" min="1">
          <label>单周期新候选上限</label><input id="cfg-max-candidates" type="number" min="1">
          <label>每日发送上限</label><input id="cfg-daily-limit" type="number" min="1">
          <label>发送间隔基准（秒）</label><input id="cfg-interval-send" type="number" min="30">
          <label>发送窗口（起-止，HH:MM）</label>
          <div style="display:flex;gap:6px">
            <input id="cfg-window-start" type="text" placeholder="09:00">
            <input id="cfg-window-end" type="text" placeholder="22:00">
          </div>
          <div style="margin-top:10px"><button class="au-btn primary" onclick="saveConfig()">保存配置</button></div>
        </div>
      </div>
      <div class="au-card">
        <h3>红线说明</h3>
        <div class="au-note">
          机器只做：采集 → 筛选（产品需要人群）→ 起草 → 风格检查。<br>
          <b>发送必须经你批准</b>——每条都在待审队列里等你点「批准发送」。批准后按仿人工节奏（间隔+抖动+窗口+日限）受控发送。<br>
          B站登录态失效时，Cookie 需手动刷新或跑一次采集扫码。
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/static/automation.js"></script>
</body>
</html>
